# One-click deploy to Render. In Render: New → Blueprint → connect this repo.
# Secrets (RPC_URL, TREASURY_SECRET, TEAM_WALLET) are marked sync:false —
# you paste them in Render's dashboard, they are NOT stored in the repo.
services:
  - type: web
    name: chiki-backend
    runtime: node
    plan: free
    # REGION IS SET AT CREATION AND CAN NEVER BE CHANGED. Without this key a Blueprint deploy
    # silently lands on Render's default (Oregon) no matter what the service is NAMED. Pinned so
    # any future recreation of this service stays with the playerbase. Verified 2026-08-04: the
    # live service IS in Singapore (min TTFB tracks the owner's 66ms SG baseline, not the 182ms
    # Oregon one; the gcp-us-west1 origin CNAME is Render's shared CDN front for ALL services and
    # says nothing about region — do not be fooled by it again).
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NETWORK
        value: devnet
      - key: RPC_URL              # paste your DEVNET Helius URL in the dashboard
        sync: false
      - key: CHIKI_MINT
        value: CPYrgdAYWFQD74ZtsR8mEBWW7qnrXnegcn7gDMobpump
      - key: MIN_HOLD
        value: "500000"
      - key: VERIFY_HOLDERS
        value: "false"            # set "true" once RPC_URL points at mainnet
      - key: TREASURY_SECRET      # paste in dashboard (JSON array or base58) — NEVER commit
        sync: false
      - key: TEAM_WALLET          # paste your team wallet public key
        sync: false
      - key: REWARD_RATE_PER_MIN
        value: "0.0008"
      - key: MAX_CLAIM_SOL
        value: "0.05"
      - key: CLAIM_COOLDOWN_SEC
        value: "30"
